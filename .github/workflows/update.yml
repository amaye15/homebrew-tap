name: update formula

# The tap follows the dtk releases by itself: it looks at the newest release every 6 hours
# (and when started by hand) and rewrites the formula if there is a new one. No token from the
# dtk repository is needed, because release data is public.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the formula for the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-formula.sh
      - name: Commit if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "formula is up to date"; exit 0; fi
          ver="$(gh release view -R amaye15/dtk --json tagName -q .tagName)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "dtk $ver"
          git push
